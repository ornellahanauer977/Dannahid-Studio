    <header class="header">

    <main>

     <section class="contact">

        <h2>Contacto</h2>

         <p>
            Si querés comunicarte conmigo para consultas,
            comentarios o colaboraciones artísticas, podés
            completar el siguiente formulario.
         </p>

        <form action="#" method="post">
            
            <label for="nombre">Nombre y Apellido</label>
            <input type="text"
            id="nombre" 
            name="nombre" 
            required>

            <label for="email">Email</label>
            <input type="email" 
            id="email" 
            name="email" 
            required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje"
            name="mensaje" 
            required></textarea>

            <button type="submit" class="btn">
                Enviar
            </button>

        </form>

     </section>

    </main>
 
    <footer class="footer">

     <p>Gracias por visitar Dannahid Studio.</p>

     <p>© 2026 Dannahid Studio</p>

   </footer>
